name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  nuget:
    uses: DavidArthurCole/EggBasket/.github/workflows/nuget-publish.yml@master
    permissions:
      contents: read
      packages: write
    with:
      pack-targets: |
        EggIncognito.Core/EggIncognito.Core.csproj
        EggIncognito.GameData/EggIncognito.GameData.csproj
    secrets: inherit

  binaries:
    name: Binary (${{ matrix.rid }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.PACKAGES_PAT }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Build self-contained binary
        run: |
          TAG="${GITHUB_REF_NAME}"
          RID="${{ matrix.rid }}"
          OUT="publish-${RID}"
          dotnet publish EggIncognito/EggIncognito.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:NoBrowser=true \
            -p:EmitTypes=false \
            -p:Version="${TAG#v}" \
            --output "$OUT"
          cp -r EggIncognito/Endpoints "$OUT/Endpoints"
          ARCHIVE="eggincognito-${TAG}-${RID}.tar.gz"
          [[ "$RID" == win-* ]] && ARCHIVE="eggincognito-${TAG}-${RID}.zip"
          if [[ "$RID" == win-* ]]; then
            (cd "$OUT" && zip -r "../$ARCHIVE" .)
          else
            tar -czf "$ARCHIVE" -C "$OUT" .
          fi
          rm -rf "$OUT"

      - name: Attach binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: eggincognito-*-${{ matrix.rid }}.*

      - name: Hash
        run: sha256sum eggincognito-*-${{ matrix.rid }}.* > "sha-${{ matrix.rid }}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: sha-${{ matrix.rid }}
          path: sha-${{ matrix.rid }}.sha256

  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sha-*
          merge-multiple: true
          path: sums

      - run: cat sums/*.sha256 > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS

  docker:
    uses: DavidArthurCole/EggBasket/.github/workflows/docker-publish.yml@master
    permissions:
      contents: read
      packages: write
      actions: write
    with:
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: app
    secrets: inherit

  docker-runner:
    uses: DavidArthurCole/EggBasket/.github/workflows/docker-publish.yml@master
    permissions:
      contents: read
      packages: write
      actions: write
    with:
      dockerfile: EggIncognito.Runner/Dockerfile
      image-suffix: -runner
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: runner
    secrets: inherit
