name: Release

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: EggIncTools/EggIdentity/.github/workflows/dotnet-ci.yml@main
    permissions:
      contents: read
      packages: read
    with:
      solution: EggIncognito.slnx
      packages-auth: true
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  create-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true

  nuget:
    needs: ci
    uses: EggIncTools/EggIdentity/.github/workflows/nuget-publish.yml@main
    permissions:
      contents: read
      packages: write
    with:
      pack-targets: |
        EggIncognito.Core/EggIncognito.Core.csproj
        EggIncognito.GameData/EggIncognito.GameData.csproj
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  binaries:
    name: Binary (${{ matrix.rid }})
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, win-x64]
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ github.token }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Build self-contained binary
        run: |
          TAG="${GITHUB_REF_NAME}"
          RID="${{ matrix.rid }}"
          OUT="publish-${RID}"
          dotnet publish EggIncognito/EggIncognito.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:NoBrowser=true \
            -p:EmitTypes=false \
            --output "$OUT"
          cp -r EggIncognito/Endpoints "$OUT/Endpoints"
          ARCHIVE="eggincognito-${TAG}-${RID}.tar.gz"
          [[ "$RID" == win-* ]] && ARCHIVE="eggincognito-${TAG}-${RID}.zip"
          if [[ "$RID" == win-* ]]; then
            (cd "$OUT" && zip -r "../$ARCHIVE" .)
          else
            tar -czf "$ARCHIVE" -C "$OUT" .
          fi
          rm -rf "$OUT"

      - name: Attach binary to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: eggincognito-*-${{ matrix.rid }}.*

      - name: Hash
        run: sha256sum eggincognito-*-${{ matrix.rid }}.* > "sha-${{ matrix.rid }}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sha-${{ matrix.rid }}
          path: sha-${{ matrix.rid }}.sha256

  checksums:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sha-*
          merge-multiple: true
          path: sums

      - run: cat sums/*.sha256 > SHA256SUMS

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: SHA256SUMS

  docker:
    needs: ci
    uses: EggIncTools/EggIdentity/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
      actions: write
    with:
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: app
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  docker-runner:
    needs: ci
    uses: EggIncTools/EggIdentity/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
      actions: write
    with:
      dockerfile: EggIncognito.Runner/Dockerfile
      image-suffix: -runner
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: runner
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  fast-deploy:
    uses: EggIncTools/EggIdentity/.github/workflows/fast-deploy-trigger.yml@main
    permissions:
      contents: read
    with:
      app: EggIncognito
      agent-url: https://eggidentity.davidarthurcole.me/agent
    secrets:
      deploy-secret: ${{ secrets.EGI_DEPLOY_AGENT_SECRET }}

  fast-deploy-runner:
    uses: EggIncTools/EggIdentity/.github/workflows/fast-deploy-trigger.yml@main
    permissions:
      contents: read
    with:
      app: EggIncognitoRunner
      agent-url: https://eggidentity.davidarthurcole.me/agent
    secrets:
      deploy-secret: ${{ secrets.EGI_RUNNER_DEPLOY_AGENT_SECRET }}
