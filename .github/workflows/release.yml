name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build EggIncognito
        run: dotnet build --configuration Release --verbosity minimal

      - name: Generate all stubs with baked fixtures
        run: |
          for lang in go python javascript java kotlin ruby csharp; do
            dotnet run --project EggIncognito.CodeGen --configuration Release --no-build -- generate $lang --bake
          done

      - name: Build Go binaries
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd generated/go
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            OS="${target%/*}"
            ARCH="${target#*/}"
            EXT=""
            [ "$OS" = "windows" ] && EXT=".exe"
            OUT="eggincognito-${TAG}-${OS}-${ARCH}${EXT}"
            GOOS=$OS GOARCH=$ARCH go build -o "$OUT" .
            ARCHIVE="eggincognito-go-${TAG}-${OS}-${ARCH}.tar.gz"
            [ "$OS" = "windows" ] && ARCHIVE="eggincognito-go-${TAG}-${OS}-${ARCH}.zip"
            if [ "$OS" = "windows" ]; then
              zip -r "../../$ARCHIVE" "$OUT" Fixtures/
            else
              tar -czf "../../$ARCHIVE" "$OUT" Fixtures/
            fi
            rm "$OUT"
          done

      - name: Build C# binaries
        run: |
          TAG="${GITHUB_REF_NAME}"
          for rid in linux-x64 linux-arm64 osx-arm64 win-x64; do
            OUT="published-csharp-${rid}"
            dotnet publish generated/csharp/EggIncognito/EggIncognito.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              --output "$OUT"
            ARCHIVE="eggincognito-csharp-${TAG}-${rid}.tar.gz"
            [[ "$rid" == win-* ]] && ARCHIVE="eggincognito-csharp-${TAG}-${rid}.zip"
            if [[ "$rid" == win-* ]]; then
              zip -r "$ARCHIVE" "$OUT/"
            else
              tar -czf "$ARCHIVE" "$OUT/"
            fi
            rm -rf "$OUT"
          done

      - name: Build Java JAR
        run: |
          TAG="${GITHUB_REF_NAME}"
          mvn -q package -DskipTests -f generated/java/pom.xml
          cp generated/java/target/mock-1.0.0-jar-with-dependencies.jar \
            "eggincognito-java-${TAG}.jar"

      - name: Build Kotlin JAR
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd generated/kotlin
          gradle -q shadowJar --no-daemon
          cd ../..
          cp generated/kotlin/build/libs/*-all.jar "eggincognito-kotlin-${TAG}.jar"

      - name: Create source archives
        run: |
          TAG="${GITHUB_REF_NAME}"
          for lang in python javascript ruby; do
            tar -czf "eggincognito-${lang}-${TAG}.tar.gz" -C generated "$lang"
          done

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            eggincognito-go-*.tar.gz
            eggincognito-go-*-windows-*.zip
            eggincognito-csharp-*-linux-*.tar.gz
            eggincognito-csharp-*-osx-*.tar.gz
            eggincognito-csharp-*-win-*.zip
            eggincognito-java-*.jar
            eggincognito-kotlin-*.jar
            eggincognito-python-*.tar.gz
            eggincognito-javascript-*.tar.gz
            eggincognito-ruby-*.tar.gz
