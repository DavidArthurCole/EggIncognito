name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Self-contained, single-file builds of the EggIncognito app per runtime, with the Endpoints/
  # response set bundled alongside the executable.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build self-contained binaries
        run: |
          TAG="${GITHUB_REF_NAME}"
          for rid in linux-x64 linux-arm64 osx-arm64 win-x64; do
            OUT="publish-${rid}"
            dotnet publish EggIncognito/EggIncognito.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              -p:PublishSingleFile=true \
              -p:NoBrowser=true \
              -p:EmitTypes=false \
              --output "$OUT"
            # Bundle the endpoint response set next to the executable (the app reads ./Endpoints,
            # overridable with EndpointsPath).
            cp -r EggIncognito/Endpoints "$OUT/Endpoints"
            ARCHIVE="eggincognito-${TAG}-${rid}.tar.gz"
            [[ "$rid" == win-* ]] && ARCHIVE="eggincognito-${TAG}-${rid}.zip"
            if [[ "$rid" == win-* ]]; then
              (cd "$OUT" && zip -r "../$ARCHIVE" .)
            else
              tar -czf "$ARCHIVE" -C "$OUT" .
            fi
            rm -rf "$OUT"
          done

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            eggincognito-*-linux-*.tar.gz
            eggincognito-*-osx-*.tar.gz
            eggincognito-*-win-*.zip

  # Publish the container image to GHCR, tagged with the release tag and `latest`.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the repo name has capitals.
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # SyncKit.Contract restore inside the image needs the GitHub Packages PAT.
          secrets: |
            github_token=${{ secrets.PACKAGES_PAT }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
          # The deploy-agent's docker-pull step reads the revision label to report commit
          # hashes (with links) instead of image digests in /updateserver embeds.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
