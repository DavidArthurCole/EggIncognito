name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Self-contained, single-file builds of the EggIncognito app per runtime, with the Endpoints/
  # response set bundled alongside the executable. One job per RID (matrix) instead of a
  # sequential loop, so all four publish in parallel.
  binaries:
    name: Binary (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # SyncKit.Contract lives on GitHub Packages; the feed requires auth even when public,
      # and the per-run GITHUB_TOKEN can't read another repo's packages. Use the account-level
      # PACKAGES_PAT secret (read:packages).
      - name: Authenticate GitHub Packages
        run: |
          dotnet nuget update source github \
            --username DavidArthurCole \
            --password ${{ secrets.PACKAGES_PAT }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Build self-contained binary
        run: |
          TAG="${GITHUB_REF_NAME}"
          RID="${{ matrix.rid }}"
          OUT="publish-${RID}"
          dotnet publish EggIncognito/EggIncognito.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:NoBrowser=true \
            -p:EmitTypes=false \
            --output "$OUT"
          # Bundle the endpoint response set next to the executable (the app reads ./Endpoints,
          # overridable with EndpointsPath).
          cp -r EggIncognito/Endpoints "$OUT/Endpoints"
          ARCHIVE="eggincognito-${TAG}-${RID}.tar.gz"
          [[ "$RID" == win-* ]] && ARCHIVE="eggincognito-${TAG}-${RID}.zip"
          if [[ "$RID" == win-* ]]; then
            (cd "$OUT" && zip -r "../$ARCHIVE" .)
          else
            tar -czf "$ARCHIVE" -C "$OUT" .
          fi
          rm -rf "$OUT"

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: eggincognito-*-${{ matrix.rid }}.*

  # Publish the container image to GHCR, tagged with the release tag and `latest`.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase; the repo name has capitals.
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # SyncKit.Contract restore inside the image needs the GitHub Packages PAT.
          secrets: |
            github_token=${{ secrets.PACKAGES_PAT }}
          build-args: |
            GITHUB_PACKAGES_USER=${{ github.actor }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
          # The deploy-agent's docker-pull step reads the revision label to report commit
          # hashes (with links) instead of image digests in /updateserver embeds.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish the device-runner image to GHCR. Same shape as `docker` above, separate context/tags.
  docker-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-runner" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: EggIncognito.Runner/Dockerfile
          push: true
          # EggIncognito.Core restore inside the image needs the GitHub Packages PAT (SyncKit.Contract).
          secrets: |
            github_token=${{ secrets.PACKAGES_PAT }}
          build-args: |
            GITHUB_PACKAGES_USER=${{ github.actor }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
