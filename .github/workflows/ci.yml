name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # SyncKit.Contract lives on GitHub Packages; the feed requires auth even when public,
      # and the per-run GITHUB_TOKEN can't read another repo's packages. Use the account-level
      # PACKAGES_PAT secret (read:packages).
      - name: Authenticate GitHub Packages
        run: |
          dotnet nuget update source github \
            --username DavidArthurCole \
            --password ${{ secrets.PACKAGES_PAT }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=normal"
