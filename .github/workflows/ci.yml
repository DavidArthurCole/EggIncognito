name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: EggIncTools/EggIdentity/.github/workflows/dotnet-ci.yml@main
    with:
      solution: EggIncognito.slnx
      packages-auth: true
      format-gate: true
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  seed-app-image-cache:
    if: github.event_name == 'push'
    uses: EggIncTools/EggIdentity/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
    with:
      push: false
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: app
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  seed-runner-image-cache:
    if: github.event_name == 'push'
    uses: EggIncTools/EggIdentity/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
    with:
      push: false
      dockerfile: EggIncognito.Runner/Dockerfile
      image-suffix: -runner
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: runner
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
