name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build --logger "console;verbosity=normal"

  codegen:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build --configuration Release

      - name: Generate stubs
        run: |
          for lang in go python javascript java kotlin ruby csharp; do
            dotnet run --project EggIncognito.CodeGen --configuration Release --no-build -- generate $lang --bake
          done

      - name: Upload generated stubs
        uses: actions/upload-artifact@v4
        with:
          name: generated-stubs
          path: generated/
          retention-days: 30
