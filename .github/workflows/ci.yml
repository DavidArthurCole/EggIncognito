name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: DavidArthurCole/EggBasket/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: EggIncognito.slnx
      packages-auth: true
      format-gate: true
      razor-include: "EggIncognito/**/*.razor"
    secrets: inherit

  seed-app-image-cache:
    if: github.event_name == 'push'
    uses: DavidArthurCole/EggBasket/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      actions: write
    with:
      push: false
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: app
    secrets: inherit

  seed-runner-image-cache:
    if: github.event_name == 'push'
    uses: DavidArthurCole/EggBasket/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      actions: write
    with:
      push: false
      dockerfile: EggIncognito.Runner/Dockerfile
      image-suffix: -runner
      needs-pat: true
      build-args: GITHUB_PACKAGES_USER=${{ github.actor }}
      cache-scope: runner
    secrets: inherit
