name: Publish Generated Stubs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        language: [go, python, javascript, java, kotlin, ruby, csharp]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build --configuration Release

      - name: Generate ${{ matrix.language }} stubs
        env:
          LANGUAGE: ${{ matrix.language }}
        run: dotnet run --project EggIncognito.CodeGen --configuration Release --no-build -- generate "$LANGUAGE" --bake

      - name: Publish to generated/${{ matrix.language }}
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          BRANCH="generated/${LANGUAGE}"
          SOURCE_SHA=$(git rev-parse --short HEAD)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BRANCH}" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH}"; then
            git worktree add /tmp/pub "${BRANCH}"
          else
            git worktree add --orphan -b "${BRANCH}" /tmp/pub
          fi

          rsync -a --delete --exclude='.git' "generated/${LANGUAGE}/" /tmp/pub/

          cd /tmp/pub
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: regenerate ${LANGUAGE} stubs (main@${SOURCE_SHA})"
            git push origin "${BRANCH}"
          fi
