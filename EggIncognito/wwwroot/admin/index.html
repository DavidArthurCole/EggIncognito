<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EggIncognito - Admin</title>
  <link rel="icon" type="image/png" href="/brand/icon-trimmed.png" />
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="m-0 bg-bg text-fg font-sans">
  <nav class="app-nav">
    <a href="/" class="app-nav-brand" title="EggIncognito"><img src="/brand/logo.png" alt="EggIncognito" /></a>
    <a href="/inspector/">Inspector</a>
    <a href="/capture/" class="nav-gated-capture">Capture</a>
    <a href="/import/" class="nav-gated-write">Import</a>
    <a href="/admin/" class="active nav-gated-admin">Admin</a>
    <span class="auth-nav" id="authNav"></span>
  </nav>
  <main id="adminMain" class="px-8 pt-6 pb-8 max-w-[900px]">
    <h1 class="text-[1.3rem] mt-0 mb-4">Admin</h1>
    <div id="denied" hidden>Admin access required. <a class="auth-btn" href="/login?returnUrl=/admin/">log in</a></div>
    <div id="panel" hidden>
      <h2>Users</h2>
      <table><thead><tr><th>User</th><th>Discord ID</th><th>Role</th><th>Last login</th></tr></thead>
        <tbody id="users"></tbody></table>
      <h2>Contributed endpoints</h2>
      <table><thead><tr><th>Path</th><th>EID</th><th>Type</th><th></th></tr></thead>
        <tbody id="endpoints"></tbody></table>
      <h2>Contributed routes</h2>
      <table><thead><tr><th>Path</th><th>Response type</th><th></th></tr></thead>
        <tbody id="routes"></tbody></table>
      <pre id="log"></pre>
    </div>
  </main>
  <a class="gh-bubble" href="https://github.com/DavidArthurCole/EggIncognito" target="_blank" rel="noopener"
     title="View EggIncognito on GitHub" aria-label="View EggIncognito on GitHub">

  </a>
  <script src="/nav.js"></script>
  <script src="admin.js"></script>
  <script src="/app-router.js"></script>
</body>
</html>
