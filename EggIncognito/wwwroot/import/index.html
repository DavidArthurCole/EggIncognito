<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EggIncognito - Import</title>
  <link rel="icon" type="image/png" href="/brand/icon-trimmed.png" />
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="m-0 bg-bg text-fg font-sans">
  <nav class="app-nav">
    <a href="/" class="app-nav-brand" title="EggIncognito"><img src="/brand/logo.png" alt="EggIncognito" /></a>
    <a href="/inspector/">Inspector</a>
    <a href="/capture/" class="nav-gated-capture">Capture</a>
    <a href="/import/" class="active">Import</a>
    <a href="/admin/" class="nav-gated-admin">Admin</a>
    <span class="auth-nav" id="authNav"></span>
  </nav>
  <main class="min-h-[calc(100vh-theme(spacing.nav))] px-8 py-10 flex flex-col items-center">
    <div class="w-full max-w-[640px]">
      <header class="mb-6">
        <h1 class="text-[1.4rem] m-0 mb-2 font-sans font-bold">Import a capture</h1>
        <p class="lead text-muted m-0 leading-[1.55] text-[0.95rem]">Load a HAR file (from the Capture tab or a browser devtools export) to decode its
           auxbrain responses into endpoint fixtures under <code class="code-chip">Endpoints/</code>. Diffs against existing
           fixtures are staged for review unless you overwrite.</p>
      </header>

      <div class="panel">
        <!-- Drop zone doubles as the file picker: click anywhere to browse, or drag a .har onto it. -->
        <label id="dropZone" class="dropzone" for="harFile">
          <input type="file" id="harFile" accept=".har,application/json" hidden />
          <div class="text-accent" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
              <path d="M12 16V4" /><path d="M7 9l5-5 5 5" /><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" />
            </svg>
          </div>
          <div class="text-[0.95rem]"><strong class="text-fg font-semibold">Drop a HAR file here</strong> or click to browse</div>
          <div id="fileName" class="font-mono text-xs text-muted">No file selected.</div>
        </label>

        <div class="flex items-center justify-between gap-3 mt-4 flex-wrap">
          <label class="inline-flex items-center gap-[0.4rem] cursor-pointer text-[0.9rem] text-[#c7c7cf]"><input type="checkbox" id="overwrite" /> overwrite existing</label>
          <button id="importBtn" class="btn-primary" disabled>Import</button>
        </div>

        <pre id="importResult" class="result-pre"></pre>
      </div>
    </div>
  </main>
  <a class="gh-bubble" href="https://github.com/DavidArthurCole/EggIncognito" target="_blank" rel="noopener"
     title="View EggIncognito on GitHub" aria-label="View EggIncognito on GitHub">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
  <script src="/nav.js"></script>
  <script src="import.js"></script>
  <script src="/app-router.js"></script>
</body>
</html>
