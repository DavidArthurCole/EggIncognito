<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EggIncognito - Transport Inspector</title>
  <link rel="stylesheet" href="/nav.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="app-nav">
    <a href="/">Home</a>
    <a href="/inspector/" class="active">Inspector</a>
    <a href="/capture/">Capture</a>
  </nav>
  <header>
    <h1>Transport Inspector</h1>
    <span class="sub">build, visualize, and send Egg, Inc. API requests</span>
    <span id="signStatus" class="badge"></span>
  </header>

  <main>
    <aside id="endpointList" class="panel">
      <h2>Endpoints</h2>
      <input id="endpointFilter" placeholder="filter..." />
      <div id="endpoints"></div>
    </aside>

    <section id="builder" class="panel">
      <h2>Request <span id="reqTypeLabel" class="muted"></span></h2>

      <details id="envPanel" open>
        <summary>Environment (BasicRequestInfo overrides)</summary>
        <div id="envFields" class="fields"></div>
      </details>

      <div id="pathParamRow" class="path-param-row hidden">
        <label for="pathParamValue">URL path parameter (e.g. EID)</label>
        <input id="pathParamValue" placeholder="EI1234567890123456" />
      </div>

      <div class="tree-head">
        <span>Request fields <span class="muted">(the request message body)</span></span>
        <label class="raw-toggle"><input type="checkbox" id="rawToggle" /> raw JSON</label>
      </div>
      <div id="fieldTree" class="fields"></div>
      <textarea id="rawJson" class="hidden" spellcheck="false"></textarea>

      <div class="sendbar">
        <button id="buildBtn">Build</button>
        <select id="target">
          <option value="real">Real auxbrain</option>
          <option value="mock">Local mock</option>
        </select>
        <button id="sendBtn" disabled>Send</button>
      </div>
    </section>

    <section id="pipeline" class="panel">
      <h2>Pipeline</h2>
      <div id="stages" class="muted">Build a request to see the transform pipeline.</div>
      <h2>Response</h2>
      <div id="response" class="muted">No response yet.</div>
    </section>
  </main>

  <section id="logsPanel" class="panel logs-panel">
    <div class="logs-head">
      <h2>Logs</h2>
      <div class="logs-controls">
        <label><input type="radio" name="logLevel" value="basic" checked /> basic</label>
        <label><input type="radio" name="logLevel" value="advanced" /> advanced</label>
        <label class="logs-follow"><input type="checkbox" id="logsAutoScroll" checked /> follow</label>
        <button id="logsClear" type="button">clear view</button>
      </div>
    </div>
    <div id="logs" class="logs"></div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
